<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2fb24c" />
  <title>动物兄弟打卡 · 家长管理端</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="admin-body">
    <div class="admin-head">
      <h1>🐾 动物兄弟打卡 · 家长端</h1>
      <div class="sub">管理任务清单、奖励与能量石积分</div>
      <div class="admin-balance">
        <div>
          <div style="font-size:12px;opacity:.9">当前能量石余额</div>
          <div class="num" id="balance">0</div>
        </div>
        <div style="font-size:26px">💎</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="tasks">任务清单</button>
      <button class="tab" data-tab="rewards">奖励兑换</button>
      <button class="tab" data-tab="history">📈 历史记录</button>
    </div>

    <!-- 任务清单 -->
    <div class="panel" id="panel-tasks">
      <div id="taskList"></div>
      <button class="btn-primary" id="addTaskBtn">+ 新增任务</button>
    </div>

    <!-- 奖励兑换 -->
    <div class="panel hidden" id="panel-rewards">
      <div id="rewardList"></div>
      <button class="btn-primary" id="addRewardBtn">+ 新增奖励</button>
    </div>

    <!-- 历史记录（日历视图） -->
    <div class="panel hidden" id="panel-history">
      <div class="cal-head">
        <button class="cal-nav-btn" id="calPrev" title="上个月">‹</button>
        <div class="cal-title" id="calTitle">2026年08月</div>
        <button class="cal-nav-btn" id="calNext" title="下个月">›</button>
        <button class="cal-nav-btn cal-today" id="calToday" title="回到今天">▲</button>
      </div>
      <div class="cal-weekdays">
        <span>周一</span><span>周二</span><span>周三</span><span>周四</span>
        <span>周五</span><span>周六</span><span>周日</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-detail" id="calDetail"></div>
    </div>

    <div class="reset-zone">
      <button class="btn-danger" id="resetBtn" type="button">🧹 清零重置（清空所有记录）</button>
      <div class="reset-hint">把能量石余额、所有打卡 / 兑换记录、已解锁的力量卡全部清空，并把任务 / 奖励恢复为初始默认。此操作不可恢复。</div>
    </div>

    <div class="foot-note">数据保存在本机浏览器，家长在浏览器即可管理。小朋友端：<a href="index.html">点击进入打卡页</a></div>
  </div>

  <!-- 任务编辑弹窗 -->
  <div class="modal-mask hidden" id="taskModal">
    <div class="modal">
      <h3 id="taskModalTitle">新增任务</h3>
      <div class="field">
        <label>任务名称</label>
        <input type="text" id="tName" maxlength="30" placeholder="如：每日阅读" />
      </div>
      <div class="field">
        <label>任务内容</label>
        <textarea id="tContent" maxlength="200" placeholder="如：亲子共读 15-20 分钟"></textarea>
      </div>
      <div class="field">
        <label>能量石数量</label>
        <input type="number" id="tStones" min="0" value="1" />
      </div>
      <div class="field">
        <label>分类</label>
        <div class="seg" id="tCat">
          <button type="button" data-v="learn" class="on">学习大冒险</button>
          <button type="button" data-v="habit">生活好习惯</button>
          <button type="button" data-v="must">徽章大挑战</button>
        </div>
      </div>
      <div class="field">
        <label>状态</label>
        <div class="seg" id="tStatus">
          <button type="button" data-v="active" class="on">启用</button>
          <button type="button" data-v="inactive">停用</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="taskCancel" style="flex:1">取消</button>
        <button class="btn-primary" id="taskSave" style="flex:2">保存</button>
      </div>
    </div>
  </div>

  <!-- 奖励编辑弹窗 -->
  <div class="modal-mask hidden" id="rewardModal">
    <div class="modal">
      <h3 id="rewardModalTitle">新增奖励</h3>
      <div class="field">
        <label>奖励名称</label>
        <input type="text" id="rName" maxlength="30" placeholder="如：看动画片 15 分钟" />
      </div>
      <div class="field">
        <label>所需能量石</label>
        <input type="number" id="rStones" min="1" value="10" />
      </div>
      <div class="field">
        <label>奖励图片（可选）</label>
        <label class="img-pick">📷 选择图片<input type="file" id="rImg" accept="image/*" hidden /></label>
        <img class="upload-prev" id="rImgPrev" alt="" />
      </div>
      <div class="field">
        <label>状态</label>
        <div class="seg" id="rStatus">
          <button type="button" data-v="active" class="on">启用</button>
          <button type="button" data-v="inactive">停用</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="rewardCancel" style="flex:1">取消</button>
        <button class="btn-primary" id="rewardSave" style="flex:2">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
